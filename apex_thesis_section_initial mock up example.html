<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Advisers – Thesis Section</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --graphite: #2B2B2B;
    --offwhite: #F8F8F8;
    --coolgrey: #9CA2A8;
    --gold: #C6A85A;
  }

  body {
    background: var(--offwhite);
    -webkit-font-smoothing: antialiased;
  }

  /* Dark hero stub */
  .hero-stub {
    background: #1A1A1A;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.03em;
  }

  /* Thesis section */
  .thesis {
    max-width: 680px;
    margin: 0 auto;
    padding: 120px 40px 140px;
  }

  /* Beat 1 — thesis lines, semi-bold */
  .thesis-lines {
    margin-bottom: 120px;
  }

  .thesis-line {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    font-weight: 600;
    color: var(--graphite);
    line-height: 1.25;
    letter-spacing: 0.01em;
  }

  /* Beat 2 — positioning, regular */
  .positioning {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 400;
    color: var(--graphite);
    line-height: 1.55;
    letter-spacing: 0.01em;
    margin-bottom: 140px;
    max-width: 560px;
  }

  /* Beat 3 — service, regular */
  .service {
    font-family: 'Cormorant Garamond', serif;
    font-size: 23px;
    font-weight: 400;
    color: var(--graphite);
    line-height: 1.5;
    letter-spacing: 0.02em;
  }

</style>
</head>
<body>

  <section class="thesis">

    <div class="thesis-lines">
      <div class="thesis-line">Energy powered the last century.</div>
      <div class="thesis-line">Intelligence builds this one.</div>
    </div>

    <p class="positioning">We guide technology leaders and investors through defining moments — bringing clarity and conviction to outcomes of enduring consequence.</p>

    <p class="service">M&amp;A and strategic advisory for technology-led companies.</p>

  </section>

</body>
</html>
